{% extends "base.html" %}
{% set bare = true %}
{% block body_class %}login{% endblock %}
{% block title %}Sign in · MCP Gateway{% endblock %}
{% block content %}
<h1>Sign in</h1>
<form method="post" action="/login">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <input type="hidden" name="next" value="{{ next }}">
  {% if error %}<div class="notice error" role="alert">{{ error }}</div>{% endif %}
  <div class="field">
    <label for="username">Username</label>
    <input type="text" id="username" name="username" autocomplete="username" autocapitalize="none" autofocus required>
  </div>
  <div class="field">
    <label for="password">Password</label>
    <input type="password" id="password" name="password" autocomplete="current-password" required>
  </div>
  <div class="button-row"><button type="submit">Sign in</button></div>
</form>
{% endblock %}
