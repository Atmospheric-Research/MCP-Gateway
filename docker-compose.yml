services:
  gateway:
    build: .
    restart: unless-stopped
    env_file: .env
    # Referenced explicitly so PaaS UIs (e.g. Coolify) pass them in and compose fails fast when unset.
    environment:
      GATEWAY_PUBLIC_URL: ${GATEWAY_PUBLIC_URL:?set GATEWAY_PUBLIC_URL}
      GATEWAY_SECRET_KEY: ${GATEWAY_SECRET_KEY:?set GATEWAY_SECRET_KEY}
    volumes:
      - ./data:/data
    expose:
      - "8000"
